name: Build
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: ["main"]
    tags: ['v*.*.*']
  pull_request:
    branches: ["main"]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  rust:
    permissions:
      contents: read
    runs-on: whisperer-runners
    # The runners are self-hosted and persistent, so never execute code from a
    # forked pull request on them — that would be arbitrary code execution on
    # the build infrastructure. Push events and same-repo PRs are fine.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # sccache -> the shared Cloudflare R2 bucket (cluster repo: charts/sccache,
    # ADR-0020). The backend config -- SCCACHE_BUCKET/ENDPOINT/REGION plus the
    # bucket-scoped S3 token -- is injected into the runner POD from the `sccache-r2`
    # Secret via envFrom, so none of it belongs in this workflow and no credential is
    # committed here.
    #
    # The redis backend is deliberately NOT set here any more (JEF-564): sccache selects
    # ONE backend from its env, so setting both would make which one you get an
    # implementation detail of sccache's precedence -- the R2 cutover could read as done
    # while every build still went to redis. If the pod env is missing, sccache degrades
    # to a local disk cache: slower, green, and obvious.
    # A workspace dep (incl. C/C++ via whisper.cpp) compiled by any repo's CI is reused here.
    # CARGO_INCREMENTAL=0 -- sccache can't cache incremental artefacts.
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
    - name: Enable rust
      run: |
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install sccache
      # --force: a warm rust-cache restores cargo's "already installed" metadata but
      # not the binary, so a plain binstall skips and sccache ends up off PATH.
      run: cargo binstall --no-confirm --force sccache
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        # sccache → in-cluster redis already covers compile reuse, so caching
        # target/ is redundant and just bloats the restore over the home uplink.
        cache-targets: false
    - name: Audit dependencies
      run: |
        cargo install cargo-audit --locked
        cargo audit
    - name: Run tests
      run: cargo nextest run
      env:
        RUST_BACKTRACE: 1
    - name: sccache stats
      if: always()
      run: sccache --show-stats
  docker:
    runs-on: whisperer-runners
    if: github.event_name != 'pull_request'
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write # Sigstore-signed SLSA build-provenance attestation (protector verifies it)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Emit the bare semver (v0.2.2 tag -> image tag 0.2.2) so the published
          # image matches what the Helm chart pulls by default
          # (image.tag | default .Chart.AppVersion, which has no leading "v").
          # The default type=ref,event=tag would keep the "v" and the chart
          # would request a tag that does not exist.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver: remote
          endpoint: tcp://buildkit.dev.svc.cluster.local:1234
          platforms: linux/amd64
          # buildkit enforces mTLS; client cert is mounted into the runner pod.
          driver-opts: |
            cacert=/home/runner/buildkit-certs/ca.crt
            cert=/home/runner/buildkit-certs/tls.crt
            key=/home/runner/buildkit-certs/tls.key
          # Second native builder: arm64 Pi. Shares the buildkit-ca, so the same
          # client cert authenticates. buildx runs each arch on its native builder
          # and merges — no QEMU emulation.
          append: |
            - endpoint: tcp://buildkit-arm64.dev.svc.cluster.local:1234
              platforms: linux/arm64
              driver-opts:
                - cacert=/home/runner/buildkit-certs/ca.crt
                - cert=/home/runner/buildkit-certs/tls.crt
                - key=/home/runner/buildkit-certs/tls.key
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Multi-arch: buildx targets two native BuildKit builders — amd64 (buildkit, node-3) + arm64 (buildkit-arm64, arm64 Pi) — building each arch on its own architecture and merging. No QEMU emulation.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache,mode=max
          # SLSA build provenance + SBOM attestations, matching the other images.
          provenance: true
          sbom: true
      # First-party installer verifies the cosign binary's own checksum, unlike
      # a bare curl|chmod of a release asset.
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "missing/invalid build digest: '$DIGEST'" >&2; exit 1; }
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
      # Sigstore-signed SLSA build-provenance attestation (keyless: Fulcio + Rekor), pushed as an
      # OCI referrer — what protector's provenance observer verifies to "provenance-verified".
      - name: Attest build provenance (Sigstore-signed SLSA)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
