name: Build
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: ["main"]
    tags: ['v*.*.*']
  pull_request:
    branches: ["main"]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  rust:
    permissions:
      contents: read
    runs-on: whisperer-runners
    # The runners are self-hosted and persistent, so never execute code from a
    # forked pull request on them — that would be arbitrary code execution on
    # the build infrastructure. Push events and same-repo PRs are fine.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # sccache -> the shared Cloudflare R2 bucket (cluster repo: charts/sccache,
    # ADR-0020). The backend config -- SCCACHE_BUCKET/ENDPOINT/REGION plus the
    # bucket-scoped S3 token -- is injected into the runner POD from the `sccache-r2`
    # Secret via envFrom, so none of it belongs in this workflow and no credential is
    # committed here. A workspace dep (incl. C/C++ via whisper.cpp) compiled by any
    # repo's CI is reused here.
    #
    # The redis backend is deliberately NOT set here any more (JEF-564): sccache selects
    # ONE backend from its env, so setting both would make which one you get an
    # implementation detail of sccache's precedence -- the R2 cutover could read as done
    # while every build still went to redis.
    #
    # The "Start sccache" step below probes R2 and degrades to a local disk cache if it
    # can't be reached -- sccache's S3 backend is EAGER, so an unreachable bucket would
    # otherwise hard-fail the job on "sccache: Timed out waiting for server startup"
    # rather than degrade to the slow-but-green local cache the redis backend degraded to.
    # CARGO_INCREMENTAL=0 -- sccache can't cache incremental artefacts.
    env:
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
    - name: Enable rust
      run: |
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install sccache
      # --force: a warm rust-cache restores cargo's "already installed" metadata but
      # not the binary, so a plain binstall skips and sccache ends up off PATH.
      run: cargo binstall --no-confirm --force sccache
    # Fail-soft sccache backend: prefer the shared R2 bucket, degrade to a LOCAL disk
    # cache if it's unreachable instead of hard-failing on "Timed out waiting for
    # server startup". GITHUB_ENV can't unset a var, so the fallback exports an EMPTY
    # SCCACHE_BUCKET alongside SCCACHE_DIR — see the measurements in the script.
    - name: Start sccache (fail-soft to local disk if R2 is down)
      run: bash .github/scripts/start-sccache.sh
    - name: Selftest the Docker-build fail-soft script
      # start-sccache-docker.sh is the in-build twin of the step above (same fail-soft
      # shape, BuildKit secrets instead of pod env) — its --selftest drives the three
      # states (no config / R2 up / R2 down) against stub binaries so a regression here
      # is caught on every PR instead of by a burned release tag.
      run: sh scripts/start-sccache-docker.sh --selftest
    - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        # sccache → the shared R2 bucket already covers compile reuse, so caching
        # target/ is redundant and just bloats the restore over the home uplink.
        cache-targets: false
    - name: Audit dependencies
      run: |
        cargo install cargo-audit --locked
        cargo audit
    - name: Run tests
      run: cargo nextest run
      env:
        RUST_BACKTRACE: 1
    - name: sccache stats
      if: always()
      run: sccache --show-stats
  docker:
    runs-on: whisperer-runners
    if: github.event_name != 'pull_request'
    needs: rust
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write # Sigstore-signed SLSA build-provenance attestation (protector verifies it)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Emit the bare semver (v0.2.2 tag -> image tag 0.2.2) so the published
          # image matches what the Helm chart pulls by default
          # (image.tag | default .Chart.AppVersion, which has no leading "v").
          # The default type=ref,event=tag would keep the "v" and the chart
          # would request a tag that does not exist.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver: remote
          endpoint: tcp://buildkit.dev.svc.cluster.local:1234
          platforms: linux/amd64
          # buildkit enforces mTLS; client cert is mounted into the runner pod.
          driver-opts: |
            cacert=/home/runner/buildkit-certs/ca.crt
            cert=/home/runner/buildkit-certs/tls.crt
            key=/home/runner/buildkit-certs/tls.key
          # Second native builder: arm64 Pi. Shares the buildkit-ca, so the same
          # client cert authenticates. buildx runs each arch on its native builder
          # and merges — no QEMU emulation.
          append: |
            - endpoint: tcp://buildkit-arm64.dev.svc.cluster.local:1234
              platforms: linux/arm64
              driver-opts:
                - cacert=/home/runner/buildkit-certs/ca.crt
                - cert=/home/runner/buildkit-certs/tls.crt
                - key=/home/runner/buildkit-certs/tls.key
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # Multi-arch: buildx targets two native BuildKit builders — amd64 (buildkit, node-3) + arm64 (buildkit-arm64, arm64 Pi) — building each arch on its own architecture and merging. No QEMU emulation.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cache,mode=max
          # sccache's shared R2 bucket for the Rust image build. Every value — credential
          # AND plain config — goes in as a BUILD SECRET, not ENV/build-args:
          #   * `AWS_*` is a credential and an ENV/ARG persists in `docker history` on every
          #     image we push to ghcr, i.e. it would publish the R2 token;
          #   * the five SCCACHE_* values are not sensitive, but a build-arg is part of the
          #     LAYER CACHE KEY, so shipping them that way would invalidate the registry layer
          #     cache on every R2 reconfiguration. Secrets are excluded from the cache key.
          # `secret-envs` (key=envname) reads them straight out of the RUNNER POD's env, where
          # the `sccache-r2` Secret is injected via envFrom (cluster repo:
          # charts/actions/runners/values.yaml) — this repo has no Actions secret for R2, and
          # this needs no `$GITHUB_ENV` lift step or on-disk secret file.
          # Unset (e.g. the Secret is missing) → the secret mounts are empty and
          # scripts/start-sccache-docker.sh degrades the build to a local disk cache rather
          # than failing it.
          secret-envs: |
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY
            SCCACHE_BUCKET=SCCACHE_BUCKET
            SCCACHE_ENDPOINT=SCCACHE_ENDPOINT
            SCCACHE_REGION=SCCACHE_REGION
            SCCACHE_S3_KEY_PREFIX=SCCACHE_S3_KEY_PREFIX
            SCCACHE_S3_USE_SSL=SCCACHE_S3_USE_SSL
          # SLSA build provenance + SBOM attestations, matching the other images.
          provenance: true
          sbom: true
      # First-party installer verifies the cosign binary's own checksum, unlike
      # a bare curl|chmod of a release asset.
      - name: Install cosign
        if: ${{ github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "missing/invalid build digest: '$DIGEST'" >&2; exit 1; }
          echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
      # Sigstore-signed SLSA build-provenance attestation (keyless: Fulcio + Rekor), pushed as an
      # OCI referrer — what protector's provenance observer verifies to "provenance-verified".
      - name: Attest build provenance (Sigstore-signed SLSA)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
